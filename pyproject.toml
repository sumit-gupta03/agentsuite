[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentsuite"
version = "0.3.0"
description = "One skill-driven agent core, many domains."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sumit Gupta" }]
keywords = [
    "agent", "ai-agent", "llm", "claude", "anthropic", "skills", "mcp",
    "data-engineering", "sql", "dbt", "pyspark", "pytorch", "rag", "terraform",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "anthropic>=0.40",
    "sqlglot>=25.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/sumit-gupta03/agentsuite"
Documentation = "https://github.com/sumit-gupta03/agentsuite#readme"
Repository = "https://github.com/sumit-gupta03/agentsuite"
Issues = "https://github.com/sumit-gupta03/agentsuite/issues"
Changelog = "https://github.com/sumit-gupta03/agentsuite/blob/main/CHANGELOG.md"
Security = "https://github.com/sumit-gupta03/agentsuite/blob/main/SECURITY.md"

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
postgres = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.1"]
snowflake = ["snowflake-connector-python>=3.6"]
bigquery = ["google-cloud-bigquery>=3.20"]
dbt = ["dbt-core>=1.7"]
mcp = ["mcp>=1.0"]
bedrock = ["boto3>=1.34"]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    # Every optional backend the test suite constructs for real. Without
    # these the suite passes only on a machine that happens to have them.
    "boto3>=1.34",
    "openai>=1.40",
]
all = [
    "agentsuite[duckdb]",
    "agentsuite[postgres]",
    "agentsuite[snowflake]",
    "agentsuite[bigquery]",
    "agentsuite[dbt]",
    "agentsuite[mcp]",
    "agentsuite[bedrock]",
    "agentsuite[openai]",
]

[project.scripts]
agentsuite = "agentsuite.cli:main"
ags = "agentsuite.cli:main"

# Third-party skill packs advertise themselves here (a module attribute holding
# a directory path); see docs/SKILLS.md.
[project.entry-points."agentsuite.skills"]

# Third-party domains advertise themselves here (an attribute holding a Domain).
# Built-in domains are resolved directly and need no entry point.
[project.entry-points."agentsuite.domains"]

[tool.hatch.build.targets.wheel]
# Each domain's skills/ directory is package data, picked up automatically --
# do not add a force-include, or the build fails on a duplicate archive entry.
packages = ["src/agentsuite"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "examples/",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Re-exports for type checkers; the runtime __all__ is computed from _EXPORTS.
"src/agentsuite/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
