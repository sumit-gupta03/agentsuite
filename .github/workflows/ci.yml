name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      # No network, no database, no API key. If this ever needs one, the change
      # that introduced it is wrong.
      - name: Test
        run: pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples

      - name: Types
        run: mypy src --no-site-packages

  examples:
    name: examples run offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e ".[dev]"

      # These need no credentials. 03_live_run is excluded because it does.
      - name: Run examples
        run: |
          for f in 01_inspect_session 02_permissions 04_extending \
                   05_governance 06_pipeline 07_routing; do
            echo "--- $f"
            python "examples/$f.py" > /dev/null
          done

  build:
    name: build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Confirm bundled skills shipped
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          skills = [n for n in names if n.endswith("SKILL.md")]
          print(f"{len(skills)} skill files in the wheel")
          if len(skills) < 20:
              sys.exit(f"expected at least 20 bundled skills, found {len(skills)}")
          if not any(n.endswith("py.typed") for n in names):
              sys.exit("py.typed is missing from the wheel")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
